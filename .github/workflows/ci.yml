name: CI

# Public repo, so Actions minutes are free and pull requests get the full run.
# arm64 is still built only on a tagged release: it is emulated through QEMU
# and takes roughly ten times as long as amd64, which makes every push slow for
# an architecture almost nobody runs Unraid on.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The check engine is tested against files ffmpeg actually renders, so
      # the runner needs a real ffmpeg — not a mock.
      #
      # timeout-minutes because a hung apt mirror is a real failure mode: this
      # step once sat in `apt-get install` for over an hour, against a suite
      # that takes ten seconds, and would have run to the six-hour job limit.
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 ffmpeg
          ffmpeg -version | head -1

      # No distro ffmpeg is built with libvmaf, so without this the quality
      # search — the part of the application that decides whether a re-encode
      # is allowed to replace someone's file — is the one thing CI cannot
      # actually exercise. Same binary and same role as in the image: scoring
      # only, never encoding.
      - name: Install an ffmpeg that has libvmaf
        timeout-minutes: 10
        run: |
          curl -fsSL -o /tmp/ff.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf /tmp/ff.tar.xz -C /tmp
          sudo install -m 0755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg \
            /usr/local/bin/ffmpeg-vmaf
          ffmpeg-vmaf -hide_banner -filters | grep -q ' libvmaf '
          ffmpeg-vmaf -version | head -1

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Validate the Unraid template
        run: python scripts/validate_template.py

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide platforms
        id: platforms
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: docker/setup-buildx-action@v3

      # A pull request from a fork has no packages:write, and a PR image has no
      # business in the registry anyway — it is built and loaded locally so the
      # smoke test can still run against it.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` comes from metadata-action's default `latest=auto`
          # flavor, which applies it to semver tags only. Do NOT also set it
          # on main: a main build is amd64-only, so `latest` would flip
          # between multi-arch and amd64-only depending on which job ran last,
          # and an arm64 user would see it break at random. `edge` is the
          # rolling main tag.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.list }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green build only proves the image assembled. Boot it and ask the
      # health endpoint, so a container that crashes on start fails here
      # rather than on someone's server.
      - name: Smoke test the image
        env:
          # Taken from the metadata action, not rebuilt from `git rev-parse`:
          # on a pull_request the checkout is the merge commit while the sha
          # tag is the PR head, so deriving it by hand names an image that was
          # never built.
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          IMAGE="$(printf '%s' "$META_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tags"][0])')"
          echo "smoke testing $IMAGE"
          docker run -d --name smoke -p 6969:6969 -e PUID=1000 -e PGID=1000 "$IMAGE"
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:6969/health; then echo; ok=1; break; fi
            sleep 2
          done
          docker logs smoke
          if [ -z "$ok" ]; then echo "container never became healthy"; exit 1; fi
          curl -fsS http://localhost:6969/api/status > /dev/null
          curl -fsS http://localhost:6969/ | grep -q unfuckarr
          docker exec smoke ffmpeg -version | head -1
          # Both halves of the transcoding stack, asserted in the finished
          # image rather than only in the build layer: Debian's ffmpeg does
          # every encode, and the static ffmpeg-vmaf does the scoring that
          # decides whether a re-encode may replace someone's file. Without
          # the second one, shrinking silently falls back to SSIM.
          docker exec smoke ffmpeg-vmaf -version | head -1
          docker exec smoke sh -c "ffmpeg-vmaf -hide_banner -filters | grep -q ' libvmaf '"
          # And the disc-image reader, which is what stops an .iso being
          # mistaken for a corrupt file.
          docker exec smoke sh -c "ffmpeg -hide_banner -protocols | grep -qw bluray"
          docker exec smoke sh -c "ffmpeg -hide_banner -protocols | grep -qw subfile"
          docker rm -f smoke
          echo "image smoke test passed"

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag's own annotation is the release body; keeping one source
          # stops the two drifting.
          git fetch --force --tags
          NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          printf '%s\n' "$NOTES" > notes.md
          cat >> notes.md <<EOF

          ---

          ## Container image

          \`\`\`
          ghcr.io/${{ github.repository }}:${TAG#v}
          ghcr.io/${{ github.repository }}:latest
          \`\`\`

          Multi-arch: \`linux/amd64\` and \`linux/arm64\` (no hardware
          transcoding on arm64 — the VAAPI drivers are amd64-only).

          The Unraid Community Applications template is \`unraid/unfuckarr.xml\`.
          EOF
          gh release create "$TAG" --title "unfuckarr $TAG" --notes-file notes.md \
            unraid/unfuckarr.xml docker-compose.yml
