services:
  unfuckarr:
    image: ghcr.io/stoatworks-labs/unfuckarr:latest
    container_name: unfuckarr
    restart: unless-stopped
    ports:
      - "6969:6969"
    environment:
      PUID: "99"
      PGID: "100"
      UMASK: "002"
      TZ: "Europe/London"
      # Optional seeding — anything set here overrides the saved config on
      # start, so leave them out once you have used the settings page.
      # UNFUCKARR_SONARR_URL: "http://sonarr:8989"
      # UNFUCKARR_SONARR_API_KEY: ""
      # UNFUCKARR_RADARR_URL: "http://radarr:7878"
      # UNFUCKARR_RADARR_API_KEY: ""
      # UNFUCKARR_EMBY_URL: "http://emby:8096"
      # UNFUCKARR_EMBY_API_KEY: ""
      # UNFUCKARR_WATCH_FOLDERS: "/media/downloads/complete"
      #
      # Where deleted and replaced files are kept. Put it INSIDE the media
      # mount and on the same share: recycling is then a rename and costs
      # nothing, while a bin on any other filesystem copies every deleted file
      # in full. The default (/config/recycle) is the wrong place for exactly
      # that reason — on Unraid /config is appdata on the cache, so a handful
      # of 40 GB remuxes fills it. Unlike the seeds above this is worth setting
      # permanently, because it describes the volume layout, not a preference.
      UNFUCKARR_RECYCLE_BIN_PATH: "/media/.recycle"
      # UNFUCKARR_RECYCLE_BIN_DAYS: "14"
      #
      # Bind to one interface — e.g. keep the service tailnet-only. Only
      # works when the interface exists INSIDE the container's network
      # namespace (network_mode: host, a tailscale sidecar, or Unraid's
      # per-container Tailscale). On the default bridge network, restrict
      # from the host side instead: publish on the tailscale address, e.g.
      # ports: ["100.64.0.5:6969:6969"].
      # UNFUCKARR_BIND_INTERFACE: "tailscale0"
    volumes:
      - ./config:/config
      # Mount media at the SAME path the *arrs use, or set path mappings in
      # the settings page. A mismatch is the single most common cause of
      # "every file is missing".
      - /mnt/user/media:/media
    devices:
      # Intel QuickSync / VAAPI. Remove if the host has no render node.
      - /dev/dri:/dev/dri
