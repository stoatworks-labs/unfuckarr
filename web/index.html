<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unfuckarr</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🔧</text></svg>">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">🔧</span>
    <span class="name">unfuckarr</span>
    <span class="ver" id="version"></span>
  </div>
  <nav id="nav">
    <a href="#/" data-route="/">Dashboard</a>
    <a href="#/files" data-route="/files">Files</a>
    <a href="#/queue" data-route="/queue">Queue</a>
    <a href="#/activity" data-route="/activity">Activity</a>
    <a href="#/recycle" data-route="/recycle">Recycle bin</a>
    <a href="#/settings" data-route="/settings">Settings</a>
  </nav>
  <div class="topbar-right">
    <span id="conn" class="conn" title="Event stream">●</span>
    <button id="pauseBtn" class="btn btn-ghost">Pause</button>
    <button id="scanBtn" class="btn btn-primary">Scan now</button>
  </div>
</header>

<div id="totals" class="totals hidden"></div>

<div id="banner" class="banner hidden"></div>

<main id="view"></main>

<div id="drawer" class="drawer hidden">
  <div class="drawer-head">
    <h3 id="drawerTitle">File</h3>
    <button class="btn btn-ghost" id="drawerClose">Close</button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
</div>
<div id="scrim" class="scrim hidden"></div>

<div id="toasts" class="toasts"></div>

<script src="app.js"></script>

<!-- The shared Stoatworks support footer. Classic and deferred, never a
     module: it reads its configuration off document.currentScript, which is
     null in a module. support-footer-version.js is served by the application
     and sets data-version on the tag below — there is no build step here to
     stamp it in, and a literal beside the tag is right only until the next
     release. Deferred scripts run in document order, so it lands first. -->
<script src="support-footer-version.js" defer></script>
<script src="support-footer.js" defer
        data-app="unfuckarr"
        data-repo="https://github.com/stoatworks-labs/unfuckarr"
        data-note="unfuckarr runs on your own server and this page never leaves your network, so a report cannot be sent from here — it is handed back for you to paste into an issue."></script>
</body>
</html>
